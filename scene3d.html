<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scène 3D - Choix du transport</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle farthest-corner at 10% 100%, #414182, #18184a, #0E0E26);
        }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> <!-- GSAP pour animations -->
</head>
<body>

<script>
    // Vérification de Three.js
    if (typeof THREE === 'undefined') {
        console.error("Erreur : THREE.js n'est pas chargé !");
    } else {
        console.log("Three.js est bien chargé !");
    }

    // Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;  // Activer les ombres
    document.body.appendChild(renderer.domElement);

    // Lumières et Ombres
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // Lumière douce pour ambiance
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.5);
    pointLight.position.set(0, 5, 5);
    scene.add(pointLight);

    // Fonction pour créer un matériau effet verre fumé + texte lumineux
    function createGlassMaterial(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 512;
        canvas.height = 256;

        // Fond semi-transparent gris foncé
        ctx.fillStyle = "rgba(30, 30, 50, 0.4)"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Texte lumineux blanc avec ombre
        ctx.fillStyle = '#ffffff';  
        ctx.font = 'Bold 60px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.shadowBlur = 20;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            opacity: 0.9, 
            roughness: 0.1, 
            metalness: 0.9 
        });
    }

    // Création des blocs (avec effet Glassmorphism et arrondi)
    const geometry = new THREE.CapsuleGeometry(1.5, 5, 20, 20); // Arrondi + Allongé

    const materialMaritime = createGlassMaterial("Maritime");
    const materialAerien = createGlassMaterial("Aérien");
    const materialTerrestre = createGlassMaterial("Terrestre");

    // Création des blocs
    const blocMaritime = new THREE.Mesh(geometry, materialMaritime);
    const blocAerien = new THREE.Mesh(geometry, materialAerien);
    const blocTerrestre = new THREE.Mesh(geometry, materialTerrestre);

    // Appliquer les ombres
    blocMaritime.castShadow = true;
    blocAerien.castShadow = true;
    blocTerrestre.castShadow = true;

    blocMaritime.receiveShadow = true;
    blocAerien.receiveShadow = true;
    blocTerrestre.receiveShadow = true;

    // Position initiale des blocs
    blocMaritime.position.set(-5, 0, -3);
    blocAerien.position.set(5, 0, -3);
    blocTerrestre.position.set(0, 0, 0);

    // Inclinaison initiale des blocs latéraux
    blocMaritime.rotation.y = 0.2;
    blocAerien.rotation.y = -0.2;

    // Ajout des blocs à la scène
    scene.add(blocMaritime, blocAerien, blocTerrestre);

    // Position initiale de la caméra
    camera.position.set(0, 0, 7);

    // Ajout d'un sol invisible pour les ombres
    const sol = new THREE.PlaneGeometry(20, 20);
    const solMat = new THREE.ShadowMaterial({ opacity: 0.3 });
    const solMesh = new THREE.Mesh(sol, solMat);
    solMesh.rotation.x = -Math.PI / 2;
    solMesh.position.y = -3;
    solMesh.receiveShadow = true;
    scene.add(solMesh);

    // Animation de la scène
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Fonction d'animation pour déplacer un bloc au centre
    function moveToCenter(selectedBloc, otherBloc1, otherBloc2) {
        // Déplacer le bloc sélectionné au centre
        gsap.to(selectedBloc.position, { x: 0, z: 0, duration: 1, ease: "power2.out" });
        gsap.to(selectedBloc.rotation, { y: 0, duration: 1, ease: "power2.out" });

        // Reculer et tourner légèrement les autres blocs
        gsap.to(otherBloc1.position, { x: -5, z: -4, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc1.rotation, { y: 0.4, duration: 1, ease: "power2.out" });

        gsap.to(otherBloc2.position, { x: 5, z: -4, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc2.rotation, { y: -0.4, duration: 1, ease: "power2.out" });
    }

    // INTERACTION : Déplacement et rotation des blocs au clic
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // Convertir la position de la souris en coordonnées Three.js
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // Détecter les objets cliqués
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([blocMaritime, blocAerien, blocTerrestre]);

        if (intersects.length > 0) {
            const selectedBloc = intersects[0].object;

            // Définir la nouvelle position des blocs
            if (selectedBloc === blocMaritime) {
                moveToCenter(blocMaritime, blocAerien, blocTerrestre);
            } else if (selectedBloc === blocAerien) {
                moveToCenter(blocAerien, blocMaritime, blocTerrestre);
            } else if (selectedBloc === blocTerrestre) {
                moveToCenter(blocTerrestre, blocMaritime, blocAerien);
            }
        }
    });

</script>

</body>
</html>
