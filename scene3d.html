<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scène 3D - Choix du transport</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #414182, #18184a, #0E0E26);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas { display: block; }
    </style>

    <!-- Three.js et GSAP via CDN -->
    <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<script>
    if (typeof THREE === 'undefined') {
        console.error("⚠ ERREUR : THREE.js ne s'est pas chargé !");
        alert("Erreur : Impossible de charger THREE.js. Vérifiez votre connexion internet.");
    } else {
        console.log("✅ THREE.js est bien chargé !");
    }

    // Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 💡 Lumière améliorée pour plus de visibilité
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.5);
    pointLight.position.set(0, 8, 10);
    scene.add(pointLight);

    // 🎨 Matériau Glassmorphism avec texte ultra net
    function createCardMaterial(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1024; // Augmenter la résolution
        canvas.height = 512;

        // Fond semi-transparent effet verre
        ctx.fillStyle = "rgba(40, 40, 80, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Texte blanc bien visible
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 100px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = "rgba(255, 255, 255, 1)";
        ctx.shadowBlur = 15;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            opacity: 1, 
            roughness: 0.1, 
            metalness: 0.7 
        });
    }

    // 📦 Création des blocs rectangulaires arrondis
    const geometry = new THREE.BoxGeometry(4, 7.5, 0.6); // Taille améliorée

    const materialMaritime = createCardMaterial("Maritime");
    const materialAerien = createCardMaterial("Aérien");
    const materialTerrestre = createCardMaterial("Terrestre");

    const blocMaritime = new THREE.Mesh(geometry, materialMaritime);
    const blocAerien = new THREE.Mesh(geometry, materialAerien);
    const blocTerrestre = new THREE.Mesh(geometry, materialTerrestre);

    blocMaritime.castShadow = blocAerien.castShadow = blocTerrestre.castShadow = true;
    blocMaritime.receiveShadow = blocAerien.receiveShadow = blocTerrestre.receiveShadow = true;

    // 📏 Position des blocs
    blocMaritime.position.set(-5, 0, -3);
    blocAerien.position.set(0, 0, -3);
    blocTerrestre.position.set(5, 0, -3);

    scene.add(blocMaritime, blocAerien, blocTerrestre);

    camera.position.set(0, 0, 12);

    // 🛑 Ombres améliorées
    const sol = new THREE.PlaneGeometry(20, 20);
    const solMat = new THREE.ShadowMaterial({ opacity: 0.3 });
    const solMesh = new THREE.Mesh(sol, solMat);
    solMesh.rotation.x = -Math.PI / 2;
    solMesh.position.y = -4;
    solMesh.receiveShadow = true;
    scene.add(solMesh);

    // 🎬 Animation fluide
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // 📌 Fonction pour recentrer le bloc sélectionné
    function moveToCenter(selectedBloc, otherBloc1, otherBloc2) {
        gsap.to(selectedBloc.position, { x: 0, z: 0, duration: 0.8, ease: "power2.out" });
        gsap.to(selectedBloc.scale, { x: 1.2, y: 1.2, duration: 0.5 });

        gsap.to(otherBloc1.position, { x: -5, z: -3, duration: 0.8, ease: "power2.out" });
        gsap.to(otherBloc2.position, { x: 5, z: -3, duration: 0.8, ease: "power2.out" });

        gsap.to(otherBloc1.scale, { x: 1, y: 1, duration: 0.5 });
        gsap.to(otherBloc2.scale, { x: 1, y: 1, duration: 0.5 });
    }

    // 🖱 Interaction au clic
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([blocMaritime, blocAerien, blocTerrestre]);

        if (intersects.length > 0) {
            const selectedBloc = intersects[0].object;
            moveToCenter(selectedBloc, blocMaritime, blocAerien, blocTerrestre);
        }
    });

</script>

</body>
</html>
