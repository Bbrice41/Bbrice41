<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scène 3D - Choix du transport</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle farthest-corner at 10% 100%, #414182, #18184a, #0E0E26);
        }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> <!-- GSAP pour animations -->
</head>
<body>

<script>
    // Vérification de Three.js
    if (typeof THREE === 'undefined') {
        console.error("Erreur : THREE.js n'est pas chargé !");
    } else {
        console.log("Three.js est bien chargé !");
    }

    // Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;  // Activer les ombres
    document.body.appendChild(renderer.domElement);

    // Lumières et Ombres
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // Lumière douce
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Création des blocs avec bords arrondis (radius = 20) et ombres
    const geometry = new THREE.CylinderGeometry(1, 1, 1.5, 20); // Cylindre avec 20 segments arrondis

    const materialMaritime = new THREE.MeshStandardMaterial({ color: 0x1E90FF, roughness: 0.3, metalness: 0.7 }); // Bleu maritime
    const materialAerien = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.7 });   // Jaune aérien
    const materialTerrestre = new THREE.MeshStandardMaterial({ color: 0x32CD32, roughness: 0.3, metalness: 0.7 }); // Vert terrestre

    // Création des blocs
    const blocMaritime = new THREE.Mesh(geometry, materialMaritime);
    const blocAerien = new THREE.Mesh(geometry, materialAerien);
    const blocTerrestre = new THREE.Mesh(geometry, materialTerrestre);

    // Appliquer les ombres
    blocMaritime.castShadow = true;
    blocAerien.castShadow = true;
    blocTerrestre.castShadow = true;

    blocMaritime.receiveShadow = true;
    blocAerien.receiveShadow = true;
    blocTerrestre.receiveShadow = true;

    // Position initiale des blocs
    blocMaritime.position.set(-3, 0, -2);
    blocAerien.position.set(3, 0, -2);
    blocTerrestre.position.set(0, 0, 0);

    // Inclinaison initiale des blocs latéraux
    blocMaritime.rotation.y = 0.2;
    blocAerien.rotation.y = -0.2;

    // Ajout des blocs à la scène
    scene.add(blocMaritime, blocAerien, blocTerrestre);

    // Position initiale de la caméra
    camera.position.set(0, 0, 5);

    // Ajout d'un sol invisible pour les ombres
    const sol = new THREE.PlaneGeometry(20, 20);
    const solMat = new THREE.ShadowMaterial({ opacity: 0.3 });
    const solMesh = new THREE.Mesh(sol, solMat);
    solMesh.rotation.x = -Math.PI / 2;
    solMesh.position.y = -1.5;
    solMesh.receiveShadow = true;
    scene.add(solMesh);

    // Animation de la scène
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Fonction d'animation pour déplacer un bloc au centre
    function moveToCenter(selectedBloc, otherBloc1, otherBloc2) {
        // Déplacer le bloc sélectionné au centre
        gsap.to(selectedBloc.position, { x: 0, z: 0, duration: 1, ease: "power2.out" });
        gsap.to(selectedBloc.rotation, { y: 0, duration: 1, ease: "power2.out" });

        // Reculer et tourner légèrement les autres blocs
        gsap.to(otherBloc1.position, { x: -3, z: -3, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc1.rotation, { y: 0.4, duration: 1, ease: "power2.out" });

        gsap.to(otherBloc2.position, { x: 3, z: -3, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc2.rotation, { y: -0.4, duration: 1, ease: "power2.out" });
    }

    // INTERACTION : Déplacement et rotation des blocs au clic
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // Convertir la position de la souris en coordonnées Three.js
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // Détecter les objets cliqués
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([blocMaritime, blocAerien, blocTerrestre]);

        if (intersects.length > 0) {
            const selectedBloc = intersects[0].object;

            // Définir la nouvelle position des blocs
            if (selectedBloc === blocMaritime) {
                moveToCenter(blocMaritime, blocAerien, blocTerrestre);
            } else if (selectedBloc === blocAerien) {
                moveToCenter(blocAerien, blocMaritime, blocTerrestre);
            } else if (selectedBloc === blocTerrestre) {
                moveToCenter(blocTerrestre, blocMaritime, blocAerien);
            }
        }
    });

</script>

</body>
</html>
