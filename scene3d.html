<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scène 3D - Choix du transport</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #414182, #18184a, #0E0E26);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas { display: block; }
    </style>

    <!-- Three.js et GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r146/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<script>
    if (typeof THREE === 'undefined') {
        console.error("⚠ ERREUR : THREE.js ne s'est pas chargé !");
        alert("Erreur : Impossible de charger THREE.js. Vérifiez votre connexion internet.");
    } else {
        console.log("✅ THREE.js est bien chargé !");
    }

    // Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lumières améliorées
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.5);
    pointLight.position.set(0, 5, 5);
    scene.add(pointLight);

    // Matériau effet "Glassmorphism"
    function createCardMaterial(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 512;
        canvas.height = 256;

        // Fond semi-transparent
        ctx.fillStyle = "rgba(20, 20, 50, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Texte blanc avec ombre
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 70px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.shadowBlur = 20;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            opacity: 1, 
            roughness: 0.2, 
            metalness: 0.8 
        });
    }

    // Création des cartes rectangulaires
    const geometry = new THREE.BoxGeometry(3.5, 6, 0.5); // Blocs plats et allongés

    const materialMaritime = createCardMaterial("Maritime");
    const materialAerien = createCardMaterial("Aérien");
    const materialTerrestre = createCardMaterial("Terrestre");

    const blocMaritime = new THREE.Mesh(geometry, materialMaritime);
    const blocAerien = new THREE.Mesh(geometry, materialAerien);
    const blocTerrestre = new THREE.Mesh(geometry, materialTerrestre);

    blocMaritime.castShadow = blocAerien.castShadow = blocTerrestre.castShadow = true;
    blocMaritime.receiveShadow = blocAerien.receiveShadow = blocTerrestre.receiveShadow = true;

    // Position initiale des blocs
    blocMaritime.position.set(-4.5, 0, -3);
    blocAerien.position.set(0, 0, -3);
    blocTerrestre.position.set(4.5, 0, -3);

    scene.add(blocMaritime, blocAerien, blocTerrestre);

    camera.position.set(0, 0, 10);

    // Animation de la scène
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Fonction pour animer la sélection
    function moveToCenter(selectedBloc, otherBloc1, otherBloc2) {
        gsap.to(selectedBloc.position, { x: 0, z: 0, duration: 1, ease: "power2.out" });
        gsap.to(selectedBloc.scale, { x: 1.2, y: 1.2, duration: 0.5 });

        gsap.to(otherBloc1.position, { x: -4.5, z: -3, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc2.position, { x: 4.5, z: -3, duration: 1, ease: "power2.out" });

        gsap.to(otherBloc1.scale, { x: 1, y: 1, duration: 0.5 });
        gsap.to(otherBloc2.scale, { x: 1, y: 1, duration: 0.5 });
    }

    // Interaction au clic
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([blocMaritime, blocAerien, blocTerrestre]);

        if (intersects.length > 0) {
            const selectedBloc = intersects[0].object;
            moveToCenter(selectedBloc, blocMaritime, blocAerien, blocTerrestre);
        }
    });

</script>

</body>
</html>
