<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scène 3D - Choix du transport</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle farthest-corner at 50% 50%, #414182, #18184a, #0E0E26);
        }
        canvas { display: block; }
    </style>
    
   <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r146/three.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<script>
    if (typeof THREE === 'undefined') {
        console.error("⚠ ERREUR : THREE.js ne s'est pas chargé !");
        alert("Erreur : Impossible de charger THREE.js. Vérifiez que `three.min.js` est bien dans le dossier.");
    } else {
        console.log("✅ THREE.js est bien chargé !");
    }

    // Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lumières améliorées
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Lumière plus forte
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 2);
    pointLight.position.set(0, 5, 5);
    scene.add(pointLight);

    // Matériau avec effet verre fumé + texte
    function createGlassMaterial(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 512;
        canvas.height = 256;

        // Fond semi-transparent avec un effet bleu foncé
        ctx.fillStyle = "rgba(50, 50, 100, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Texte lumineux
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 70px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
        ctx.shadowBlur = 20;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            opacity: 0.95, 
            roughness: 0.1, 
            metalness: 0.9 
        });
    }

    // Géométrie plus visible
    const geometry = new THREE.CylinderGeometry(1.8, 1.8, 7, 64); 

    const materialMaritime = createGlassMaterial("Maritime");
    const materialAerien = createGlassMaterial("Aérien");
    const materialTerrestre = createGlassMaterial("Terrestre");

    // Création des blocs
    const blocMaritime = new THREE.Mesh(geometry, materialMaritime);
    const blocAerien = new THREE.Mesh(geometry, materialAerien);
    const blocTerrestre = new THREE.Mesh(geometry, materialTerrestre);

    blocMaritime.castShadow = blocAerien.castShadow = blocTerrestre.castShadow = true;
    blocMaritime.receiveShadow = blocAerien.receiveShadow = blocTerrestre.receiveShadow = true;

    // Position initiale des blocs
    blocMaritime.position.set(-5, 0, -3);
    blocAerien.position.set(5, 0, -3);
    blocTerrestre.position.set(0, 0, 0);

    blocMaritime.rotation.y = 0.2;
    blocAerien.rotation.y = -0.2;

    scene.add(blocMaritime, blocAerien, blocTerrestre);

    camera.position.set(0, 0, 8);

    // Ajout d'un sol invisible pour les ombres
    const sol = new THREE.PlaneGeometry(20, 20);
    const solMat = new THREE.ShadowMaterial({ opacity: 0.3 });
    const solMesh = new THREE.Mesh(sol, solMat);
    solMesh.rotation.x = -Math.PI / 2;
    solMesh.position.y = -4;
    solMesh.receiveShadow = true;
    scene.add(solMesh);

    // Animation de la scène
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Fonction pour déplacer un bloc au centre
    function moveToCenter(selectedBloc, otherBloc1, otherBloc2) {
        gsap.to(selectedBloc.position, { x: 0, z: 0, duration: 1, ease: "power2.out" });
        gsap.to(selectedBloc.rotation, { y: 0, duration: 1, ease: "power2.out" });

        gsap.to(otherBloc1.position, { x: -5, z: -4, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc1.rotation, { y: 0.4, duration: 1, ease: "power2.out" });

        gsap.to(otherBloc2.position, { x: 5, z: -4, duration: 1, ease: "power2.out" });
        gsap.to(otherBloc2.rotation, { y: -0.4, duration: 1, ease: "power2.out" });
    }

    // Interaction : Déplacement des blocs au clic
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([blocMaritime, blocAerien, blocTerrestre]);

        if (intersects.length > 0) {
            const selectedBloc = intersects[0].object;
            moveToCenter(selectedBloc, blocMaritime, blocAerien, blocTerrestre);
        }
    });

</script>

</body>
</html>
